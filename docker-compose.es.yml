# Docker Compose for Orkestra.ES integration tests.
#
# Brings up a single-node Elasticsearch (capped at 4 GB) plus a Postgres
# instance used by the projection checkpoint store and the existing
# :postgres-tagged tests. Start with:
#
#     docker compose -f docker-compose.es.yml up -d --wait
#
# and run the integration suite with:
#
#     mix test.integration
#
# The Postgres service matches the DATABASE_URL default used by the test
# suite (postgres://postgres:postgres@localhost/orkestra_test), so the
# existing :postgres tests run without any config change.
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: orkestra-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    mem_limit: 4g
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: orkestra-pg
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=orkestra_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orkestra_test"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
